<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DVX Dashboard</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}
    .wrap{max-width:1200px;margin:auto;padding:24px}
    h1{margin:0 0 6px}.muted{color:#9aa4bd}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
    .card{background:#121a2e;border:1px solid #263250;border-radius:14px;padding:18px}
    .num{font-size:28px;font-weight:700;margin-top:8px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    input,button{border-radius:9px;border:1px solid #33415f;padding:10px 12px;background:#0f1729;color:#fff}
    button{cursor:pointer}.primary{background:#315efb;border-color:#315efb}
    .danger{background:#9f2d3f;border-color:#9f2d3f}
    table{width:100%;border-collapse:collapse;background:#121a2e;border-radius:14px;overflow:hidden}
    th,td{padding:11px;border-bottom:1px solid #263250;text-align:left;font-size:14px}
    th{color:#aeb9d2}.pill{padding:4px 8px;border-radius:20px;background:#173b2b;color:#8df0b0}
    .logs{max-height:260px;overflow:auto}.log{padding:8px 0;border-bottom:1px solid #263250}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:500px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>DVX Dashboard</h1>
  <div class="muted">Account and EXP monitoring dashboard</div>

  <div class="grid">
    <div class="card"><div class="muted">Accounts</div><div id="accounts" class="num">0</div></div>
    <div class="card"><div class="muted">Matches</div><div id="matches" class="num">0</div></div>
    <div class="card"><div class="muted">Gained EXP</div><div id="exp" class="num">0</div></div>
    <div class="card"><div class="muted">Uptime</div><div id="uptime" class="num">0s</div></div>
  </div>

  <div class="card">
    <h2>Account Management</h2>
    <div class="toolbar">
      <input id="uid" placeholder="UID">
      <input id="password" type="password" placeholder="Password">
      <button class="primary" onclick="addAccount()">Add Account</button>
      <input id="token" placeholder="Token">
      <button class="primary" onclick="addToken()">Add Token</button>
    </div>
    <div id="msg" class="muted"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Accounts</h2>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>UID</th><th>Nickname</th><th>Region</th><th>Level</th><th>EXP</th><th>Gained</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="accountRows"></tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Logs</h2>
    <div id="logs" class="logs"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function msg(t){ $("msg").textContent=t; setTimeout(()=>{$("msg").textContent=""},3000); }
function esc(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(n){return Number(n||0).toLocaleString();}

async function post(url, data){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  return r.json();
}
async function addAccount(){
  const uid=$("uid").value.trim(), password=$("password").value.trim();
  if(!uid||!password){msg("UID and password are required");return;}
  const r=await post("/api/account/add",{uid,password});
  msg(r.status==="ok"?"Account added":(r.error||"Request failed"));
  if(r.status==="ok"){$("uid").value="";$("password").value="";load();}
}
async function addToken(){
  const token=$("token").value.trim();
  if(!token){msg("Token is required");return;}
  const r=await post("/api/account/add",{token});
  msg(r.status==="ok"?"Token added":(r.error||"Request failed"));
  if(r.status==="ok"){$("token").value="";load();}
}
async function removeAccount(uid){
  if(!confirm("Remove account "+uid+"?")) return;
  const r=await post("/api/account/delete",{uid});
  msg(r.status==="ok"?"Account removed":(r.error||"Request failed")); load();
}
async function refreshAccount(uid){
  const r=await post("/api/account/refresh",{uid});
  msg(r.status==="ok"?"Refresh requested":(r.error||"Request failed")); load();
}
function render(data){
  $("accounts").textContent=fmt(data.total_accounts);
  $("matches").textContent=fmt(data.total_matches);
  $("exp").textContent=fmt(data.total_gained_exp);
  $("uptime").textContent=fmt(data.uptime)+"s";

  $("accountRows").innerHTML=(data.accounts||[]).map(a=>`
    <tr>
      <td>${esc(a.uid)}</td><td>${esc(a.nickname)}</td><td>${esc(a.region)}</td>
      <td>${esc(a.level)}</td><td>${fmt(a.current_exp)}</td><td>${fmt(a.gained_exp)}</td>
      <td><span class="pill">${esc(a.status)}</span></td>
      <td><button onclick="refreshAccount('${esc(a.uid)}')">Refresh</button>
      <button class="danger" onclick="removeAccount('${esc(a.uid)}')">Delete</button></td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">No accounts registered.</td></tr>`;

  $("logs").innerHTML=(data.logs||[]).slice().reverse().map(l=>
    `<div class="log"><b>[${esc(l.time)}]</b> ${esc(l.message)}</div>`
  ).join("") || `<div class="muted">No logs yet.</div>`;
}
async function load(){
  try{
    const r=await fetch("/api/stats",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    render(await r.json());
  }catch(e){msg("Dashboard API unavailable");}
}
load(); setInterval(load,3000);
</script>
</body>
</html>
